# Ablation (H1): same counts as 1_large, but the targets come from many small (2-6 patch) non-overlapping blocks
# spread over the image, i.e. the contiguity of the hidden region is removed.
strategy: scattered
ctx_size: 20
tgt_size: 32
tgt_scale: [0.04, 0.07]
tgt_aspect: [0.75, 1.5]
ctx_scale: [0.85, 1.0]
per_block: true            # one target set per block (upstream I-JEPA); false: one set from the union
