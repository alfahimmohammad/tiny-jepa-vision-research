# Two large target blocks (16-30 patches each, mostly 20-25) that may overlap; fixed counts as 1_large.
strategy: blocks
ctx_size: 20
tgt_size: 32
n_targets: 2
tgt_scale: [0.30, 0.40]
tgt_aspect: [0.75, 1.5]
ctx_scale: [0.85, 1.0]
overlap: true
per_block: true            # one target set per block (upstream I-JEPA); false: one set from the union
