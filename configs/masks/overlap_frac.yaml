# 4 upstream-size target blocks (fixed target count) with a cap on pairwise overlap: |A n B| / |A| < max_overlap_frac for every pair of target blocks
# (exact enumeration). Context: up to ctx_size patches per image (full grid if fewer than full_ctx_below are left in
# the context block; layouts leaving fewer than min_ctx are excluded), trimmed to the batch minimum.
strategy: overlap_frac
ctx_size: 20
tgt_size: 32
n_targets: 4
tgt_scale: [0.15, 0.20]
tgt_aspect: [0.75, 1.5]
ctx_scale: [0.85, 1.0]
max_overlap_frac: 0.25
full_ctx_below: 16
min_ctx: 12
per_block: true            # one target set per block (upstream I-JEPA); false: one set from the union
